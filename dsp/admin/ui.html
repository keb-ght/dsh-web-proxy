<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ds-web-proxy 控制台</title>
<style>
  :root{
    --bg:#0c0d10; --panel:#14161b; --panel-2:#1a1d24; --line:#262a33;
    --fg:#e8eaee; --fg-dim:#8b93a1; --fg-mute:#5d6573;
    --accent:#5b8cff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* 布局 */
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:#0a0b0e}
  .brand{padding:6px 10px 18px;font-weight:600;letter-spacing:.2px}
  .brand small{display:block;color:var(--fg-mute);font-weight:400;font-size:11px;margin-top:2px}
  .nav{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:var(--fg-dim);cursor:pointer;user-select:none}
  .nav:hover{background:var(--panel);color:var(--fg)}
  .nav.active{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
  .side .foot{margin-top:auto;color:var(--fg-mute);font-size:11px;padding:10px;line-height:1.7}

  .main{padding:26px 30px 60px;max-width:1180px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
  h1{font-size:19px;margin:0;font-weight:600}
  .sub{color:var(--fg-mute);font-size:12px;margin-top:4px}

  /* 组件 */
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);
    padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#39404d;background:#20242c}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#0a122a;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--err);border-color:#3a2226}
  .btn.danger:hover{background:#241a1c}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
  .kpi .k{color:var(--fg-mute);font-size:11.5px;letter-spacing:.3px;text-transform:uppercase}
  .kpi .v{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.5px}
  .kpi .v small{font-size:13px;color:var(--fg-dim);font-weight:400;margin-left:4px}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--fg-mute);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tbody tr:hover{background:#151821}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:5px}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg-dim)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.ready{color:var(--ok);border-color:#1d3b2f;background:#10221b}
  .badge.needs_login{color:var(--warn);border-color:#3b3320;background:#221d10}
  .badge.cooldown{color:#fb923c;border-color:#3d2a1a;background:#23180f}
  .badge.off{color:var(--fg-mute);border-color:var(--line);background:#15171c}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto}.side .foot{display:none}.grid2{grid-template-columns:1fr}}

  label.field{display:block;margin-bottom:14px}
  label.field span{display:block;color:var(--fg-dim);font-size:12px;margin-bottom:6px}
  input[type=text],input[type=number],input[type=password],textarea,select{
    width:100%;background:#0f1116;border:1px solid var(--line);border-radius:9px;color:var(--fg);
    padding:9px 11px;font-size:13px;font-family:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:#3a4a6b;box-shadow:0 0 0 3px rgba(91,140,255,.12)}
  textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6}
  .hint{color:var(--fg-mute);font-size:11.5px;margin-top:5px;line-height:1.6}

  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:140px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
  .bar .track{height:7px;background:#1b1e25;border-radius:999px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#5b8cff,#8b6cff);border-radius:999px}
  .bar .num{text-align:right;color:var(--fg-dim)}

  .empty{padding:34px;text-align:center;color:var(--fg-mute);font-size:13px}
  .toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast .t{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:10px 14px;border-radius:10px;font-size:13px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .toast .t.err{border-left-color:var(--err)}
  .toast .t.ok{border-left-color:var(--ok)}

  dialog{border:none;background:var(--panel);color:var(--fg);border-radius:16px;padding:22px;width:min(560px,92vw);
    box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid var(--line)}
  dialog::backdrop{background:rgba(4,5,8,.65);backdrop-filter:blur(3px)}
  dialog h3{margin:0 0 4px;font-size:16px}
  dialog .d-sub{color:var(--fg-mute);font-size:12px;margin-bottom:16px}
  .seg{display:flex;gap:6px;margin-bottom:16px}
  .seg button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:#12141a;color:var(--fg-dim);cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--panel-2);color:var(--fg);border-color:#39404d}
  .login{max-width:380px;margin:16vh auto}

  .mono.small{font-size:11.5px;color:var(--fg-dim)}
  .trunc{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
  .pulse{animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const urlToken = new URLSearchParams(location.search).get('token') || '';
if (urlToken) localStorage.setItem('ds_admin_token', urlToken);
const state = { token: urlToken || localStorage.getItem('ds_admin_token') || '', view: 'overview', data: null, logs: [], timer: null };

function openWebLogin() {
  const dlg = document.createElement('dialog');
  dlg.style.cssText = 'width:min(860px,96vw);height:min(88vh,900px);padding:0;overflow:hidden;display:flex;flex-direction:column';
  dlg.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)">
      <div>
        <div style="font-weight:600">网页登录</div>
        <div class="hint" style="margin-top:2px">在下面登录 DeepSeek，成功后自动入库，不用复制 token</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn sm" id="wl-check">检查</button>
        <button class="btn sm" id="wl-close">关闭</button>
      </div>
    </div>
    <iframe id="wl-frame" src="/login" style="flex:1;width:100%;border:0;background:#fff"></iframe>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  dlg.onclose = () => dlg.remove();

  const frame = $('#wl-frame', dlg);
  let before = state.data ? state.data.accounts.length : 0;
  let closed = false;

  // 未重启时 /login 是 404 → 直接提示，不让用户对着 JSON 发呆
  frame.onload = () => {
    try {
      const doc = frame.contentDocument;
      const txt = (doc && doc.body && doc.body.textContent || '').slice(0, 200);
      if (txt.includes('not found') || txt.includes('invalid_request_error')) {
        const box = doc.createElement('div');
        box.style.cssText = 'padding:28px;font:15px/1.7 -apple-system,sans-serif;color:#333';
        box.innerHTML = '<b>插件还没重启生效</b><br>这个页面用的是新代码，但运行中的反代还是旧的。<br>请完全退出 DSH 再打开一次，然后重试。';
        doc.body.replaceChildren(box);
      }
    } catch (e) { /* 跨源时忽略 */ }
  };

  const check = async () => {
    try {
      const d = await api('/overview');
      state.data = d;
      if (d.accounts.length > before) {
        toast('✓ 已捕获登录态，账号已入库', 'ok');
        dlg.close();
        render();
        return true;
      }
    } catch (e) { /* ignore */ }
    return false;
  };

  const timer = setInterval(async () => {
    if (closed) return;
    if (await check()) { clearInterval(timer); }
  }, 2000);

  $('#wl-check', dlg).onclick = () => check().then((ok) => { if (!ok) toast('还没检测到登录态，先完成登录', 'err'); });
  $('#wl-close', dlg).onclick = () => { closed = true; clearInterval(timer); dlg.close(); };
}

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 't ' + kind;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

async function api(path, opts = {}) {
  const res = await fetch('/admin/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': state.token, ...(opts.headers || {}) },
  });
  if (res.status === 401) { state.token = ''; localStorage.removeItem('ds_admin_token'); renderLogin('token 无效或已变更'); throw new Error('unauthorized'); }
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('json')) return res;
  return res.json();
}

// ── 登录 ────────────────────────────────────────────────
function renderLogin(err) {
  clearInterval(state.timer);
  $('#root').innerHTML = `
    <div class="login">
      <div class="card">
        <div style="font-weight:600;margin-bottom:4px">ds-web-proxy 控制台</div>
        <div class="sub" style="margin-bottom:16px">输入管理 token（启动日志里打印，也在 <code>secrets/admin.token</code>）</div>
        <label class="field"><span>Admin Token</span>
          <input type="password" id="tk" placeholder="粘贴 token" autocomplete="off"></label>
        ${err ? `<div style="color:var(--err);font-size:12.5px;margin-bottom:12px">${esc(err)}</div>` : ''}
        <button class="btn primary" style="width:100%" id="go">进入</button>
      </div>
    </div>`;
  const submit = async () => {
    state.token = $('#tk').value.trim();
    localStorage.setItem('ds_admin_token', state.token);
    try { await refresh(); render(); } catch { /* handled */ }
  };
  $('#go').onclick = submit;
  $('#tk').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  $('#tk').focus();
}

// ── 数据 ────────────────────────────────────────────────
async function refresh() {
  state.data = await api('/overview');
  render();
}

function statusBadge(a) {
  if (!a.enabled) return '<span class="badge off">已停用</span>';
  if (a.status === 'needs_login' || !a.hasToken) return '<span class="badge needs_login">待登录</span>';
  if (a.cooldownMs > 0) return `<span class="badge cooldown">冷却 ${Math.ceil(a.cooldownMs / 1000)}s</span>`;
  return '<span class="badge ready">可用</span>';
}

// ── 视图 ────────────────────────────────────────────────
const views = {
  overview(d) {
    const m = d.metrics;
    const max = Math.max(1, ...Object.values(m.byCode));
    return `
      <div class="kpis">
        <div class="kpi"><div class="k">可用账号</div><div class="v">${d.accounts.filter(a => a.enabled && a.status === 'ready' && a.cooldownMs === 0).length}<small>/ ${d.accounts.length}</small></div></div>
        <div class="kpi"><div class="k">请求总数</div><div class="v">${m.requests}<small>流式 ${m.streams}</small></div></div>
        <div class="kpi"><div class="k">成功率</div><div class="v">${m.successRate === null ? '—' : m.successRate + '%'}<small>错误 ${m.errors}</small></div></div>
        <div class="kpi"><div class="k">延迟 P95</div><div class="v">${m.latency.p95}<small>ms · avg ${m.latency.avg}</small></div></div>
      </div>
      <div class="grid2">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:14px">
            <div style="font-weight:600">错误码分布</div>
            <span class="mono small">近 ${m.latency.samples} 次</span>
          </div>
          ${Object.keys(m.byCode).length ? `<div class="bars">${Object.entries(m.byCode).map(([k, v]) => `
            <div class="bar"><span class="mono" style="color:${/TOKEN|BANNED|RESTRICTED/.test(k) ? 'var(--warn)' : 'var(--fg-dim)'}">${esc(k)}</span>
              <div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div>
              <span class="num">${v}</span></div>`).join('')}</div>`
            : '<div class="empty">还没有错误记录</div>'}
        </div>
        <div class="card">
          <div style="font-weight:600;margin-bottom:14px">环境</div>
          <table>
            <tbody>
              <tr><th>监听</th><td class="mono small">${esc(d.config.host)}:${d.config.port}</td></tr>
              <tr><th>单账号限速</th><td class="mono small">${d.config.rateLimitPerMinute} 次/分</td></tr>
              <tr><th>PoW 缓存</th><td class="mono small">${d.config.powCacheSize} 条</td></tr>
              <tr><th>网关鉴权</th><td class="mono small">${d.config.apiKeysCount ? d.config.apiKeysCount + ' 个 key' : '未开启'}</td></tr>
              <tr><th>慢路径</th><td class="mono small">${d.browser.enabled ? '已启用 · ' + esc(d.config.browser.cdpUrl) : '关闭'}</td></tr>
              <tr><th>模型</th><td class="mono small">${d.models.map(esc).join(' · ')}</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;
  },

  accounts(d) {
    if (!d.accounts.length) {
      return `<div class="card"><div class="empty">
        还没有账号。<br><br>
        <button class="btn primary" onclick="openWebLogin()">网页登录（自动获取）</button>
        <button class="btn" onclick="openImport()" style="margin-left:8px">手动粘贴 token</button>
        <div class="hint" style="margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto">
          网页登录会打开 DeepSeek 登录页（在本机反代域下），登录成功后 token 自动进账号池，不用手动复制。
        </div>
      </div></div>`;
    }
    return `
      <div class="card" style="padding:0;overflow:hidden">
        <table>
          <thead><tr>
            <th>账号</th><th>状态</th><th>设备指纹</th><th>冷却</th><th>最近错误</th><th></th>
          </tr></thead>
          <tbody>${d.accounts.map((a) => `
            <tr>
              <td><div style="font-weight:500">${esc(a.name) || '<span style="color:var(--fg-mute)">未命名</span>'}</div>
                  <div class="mono small">${esc(a.id)}</div></td>
              <td>${statusBadge(a)}</td>
              <td class="mono small"><span class="trunc" title="${esc(a.deviceId)}">${esc(a.deviceId)}</span></td>
              <td class="mono small">${a.cooldownMs ? Math.ceil(a.cooldownMs / 1000) + 's' : '—'}</td>
              <td class="mono small">${a.lastError ? esc(a.lastError) : '—'}</td>
              <td class="actions">
                <button class="btn sm" data-act="probe" data-id="${esc(a.id)}">探活</button>
                <button class="btn sm" data-act="relogin" data-id="${esc(a.id)}">重登</button>
                <button class="btn sm" data-act="reset" data-id="${esc(a.id)}">重置指纹</button>
                <button class="btn sm" data-act="toggle" data-id="${esc(a.id)}" data-enabled="${a.enabled}">${a.enabled ? '停用' : '启用'}</button>
                <button class="btn sm" data-act="rename" data-id="${esc(a.id)}" data-name="${esc(a.name || '')}">改名</button>
                <button class="btn sm danger" data-act="del" data-id="${esc(a.id)}">删除</button>
              </td>
            </tr>`).join('')}</tbody>
        </table>
      </div>`;
  },

  logs() {
    if (!state.logs.length) return '<div class="card"><div class="empty">暂无请求日志（发一个请求就会出现在这里）</div></div>';
    return `<div class="card" style="padding:0;overflow:hidden"><table>
      <thead><tr><th style="width:92px">时间</th><th style="width:70px">结果</th><th>账号</th><th>模型</th><th style="width:70px">耗时</th><th>摘要</th></tr></thead>
      <tbody>${state.logs.map((l) => `
        <tr>
          <td class="mono small">${new Date(l.t).toLocaleTimeString('zh-CN', { hour12: false })}</td>
          <td>${l.level === 'ok' ? '<span class="badge ready">ok</span>' : `<span class="badge cooldown">${esc(l.code || 'err')}</span>`}</td>
          <td class="mono small">${esc(l.account || '—')}</td>
          <td class="mono small">${esc(l.model)}</td>
          <td class="mono small">${l.ms}ms</td>
          <td class="mono small"><span class="trunc" title="${esc(l.preview || l.msg || '')}">${esc(l.preview || l.msg || '')}</span></td>
        </tr>`).join('')}</tbody></table></div>`;
  },

  settings(d) {
    const c = d.config;
    const rows = (d.models || []).map((m, i) => `
      <tr data-row="${i}">
        <td><input type="text" class="m-id" value="${esc(m.id)}" style="min-width:150px"></td>
        <td><select class="m-up" style="min-width:110px">${(d.upstreamTypes || ['default','expert','vision']).map((u) => `<option value="${u}" ${m.upstream === u ? 'selected' : ''}>${u}</option>`).join('')}</select></td>
        <td style="text-align:center"><input type="checkbox" class="m-think" ${m.thinking ? 'checked' : ''}></td>
        <td style="text-align:center"><input type="checkbox" class="m-on" ${m.enabled ? 'checked' : ''}></td>
        <td><input type="text" class="m-label" value="${esc(m.label || '')}" style="min-width:150px"></td>
        <td class="actions"><button class="btn sm danger" data-del-model="${i}">删除</button></td>
      </tr>`).join('');

    return `
      <div class="grid2" style="align-items:start">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:6px">
            <div style="font-weight:600">模型设置</div>
            <button class="btn sm" id="add-model">+ 新增</button>
          </div>
          <div class="hint" style="margin-bottom:12px">
            对外模型名 → 上游 <code>model_type</code>。客户端只看到左列的名字，右列决定实际打哪个上游模型和是否开思考。
          </div>
          <table id="model-table">
            <thead><tr><th>对外模型名</th><th>上游类型</th><th>思考</th><th>启用</th><th>显示名</th><th></th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="empty">无模型</td></tr>'}</tbody>
          </table>
          <div class="row" style="margin-top:14px"><button class="btn primary" id="save-models">保存模型设置</button></div>
        </div>

        <div class="card">
          <div style="font-weight:600;margin-bottom:6px">接入信息</div>
          <div class="hint" style="margin-bottom:12px">客户端把 base_url 指到这里，就是一个标准 OpenAI 端点。</div>
          <table><tbody>
            <tr><th>Base URL</th><td class="mono small">http://${esc(c.host)}:${c.port}/v1</td></tr>
            <tr><th>模型列表</th><td class="mono small">${(d.models || []).filter((m) => m.enabled).map((m) => esc(m.id)).join(' · ') || '—'}</td></tr>
            <tr><th>网关 Key</th><td class="mono small">${c.apiKeysCount ? '已开启（' + c.apiKeysCount + ' 个）' : '未开启，任意 key 均可'}</td></tr>
          </tbody></table>
          <div style="font-weight:600;margin:16px 0 8px">链路</div>
          <pre class="mono small" style="background:#0f1116;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto">客户端 ──OpenAI /v1/chat/completions──▶ 反代
                                        │
                    账户池 · PoW 求解 · 会话
                                        │
                                        ▼
                    chat.deepseek.com/api/v0/chat/completion
                    header: Authorization + X-DS-PoW-Response</pre>
          <div class="hint">反代本身不占「模型设置」里的位置——它把自己伪装成一个 OpenAI 兼容 provider，
          谁配了 base_url 谁就能用，包括各类客户端和上层框架。</div>
        </div>
      </div>

      <div class="card" style="max-width:640px;margin-top:16px">
        <div style="font-weight:600;margin-bottom:14px">运行参数</div>
        <label class="field"><span>单账号限速（次/分钟）</span>
          <input type="number" id="s-rate" value="${c.rateLimitPerMinute}" min="1" max="120">
          <div class="hint">调高会更容易撞上游 <code>40029 IP_ACCESS_RESTRICTED</code>。</div></label>
        <label class="field"><span>PoW 提前刷新余量（毫秒）</span>
          <input type="number" id="s-margin" value="${c.powRefreshMarginMs}" step="5000">
          <div class="hint">上游挑战带 expire_after，官方前端留 60s。留太小会集中过期。</div></label>
        <label class="field"><span>网关 API Key（逗号分隔，留空不校验）</span>
          <input type="text" id="s-keys" value="" placeholder="sk-xxx,sk-yyy">
          <div class="hint">当前 ${c.apiKeysCount} 个。填写即覆盖（不显示已有明文）。</div></label>
        <label class="field"><span>慢路径（真浏览器兜底）</span>
          <select id="s-browser">
            <option value="0" ${c.browser.enabled ? '' : 'selected'}>关闭</option>
            <option value="1" ${c.browser.enabled ? 'selected' : ''}>启用</option>
          </select></label>
        <label class="field"><span>CDP 地址</span>
          <input type="text" id="s-cdp" value="${esc(c.browser.cdpUrl)}">
          <div class="hint">指向已开的 Chrome（<code>--remote-debugging-port=9222</code>）可复用登录态。</div></label>
        <div class="row">
          <button class="btn primary" id="save-settings">保存运行参数</button>
          <button class="btn" id="test-browser">测试浏览器连通</button>
        </div>
      </div>`;
  },

  providers(d) {
    return `
      <div class="card" style="max-width:760px">
        <div style="font-weight:600;margin-bottom:6px">已注册 Provider</div>
        <div class="hint" style="margin-bottom:16px">
          本项目只带 <code>manual</code>（自有账号导入）。批量注册/自动登录一类能力通过 provider 接口扩展，
          由第三方自行实现并注入，仓库不附带实现。接口见 <code>docs/PROVIDERS.md</code>。
        </div>
        <table><tbody>
          ${d.providers.map((p) => `<tr><td class="mono" style="width:160px">${esc(p.name)}</td><td class="small">${esc(p.description)}</td></tr>`).join('')}
        </tbody></table>
        <div style="margin-top:18px;font-weight:600;margin-bottom:6px">接入方式</div>
        <pre class="mono small" style="background:#0f1116;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto">// 1. 写一个实现 src/providers/my-provider.mjs
registerProvider({ name:'my-provider', async acquire(ctx){ return { token:'…', deviceId:'uuid' } } });

// 2. 在 src/server.mjs 顶部加一行副作用 import
import './providers/my-provider.mjs';</pre>
      </div>`;
  },
};

function render() {
  if (!state.token) return renderLogin();
  const d = state.data;
  if (!d) return;
  const titles = { overview: ['概览', '运行状态与错误分布'], accounts: ['账号池', '自有账号 · 轮转 / 冷却 / 指纹'], logs: ['请求日志', '最近 300 条'], settings: ['设置', '限速 / PoW / 鉴权 / 慢路径'], providers: ['Provider', '插件插槽'] };
  const [h1, sub] = titles[state.view];
  $('#root').innerHTML = `
    <div class="app">
      <aside class="side">
        <div class="brand">ds-web-proxy<small>chat.deepseek.com 反代</small></div>
        ${[['overview', '概览'], ['accounts', '账号池'], ['logs', '请求日志'], ['settings', '设置'], ['providers', 'Provider']]
          .map(([k, label]) => `<div class="nav ${state.view === k ? 'active' : ''}" data-view="${k}"><span class="dot"></span>${label}${k === 'accounts' ? `<span style="margin-left:auto;color:var(--fg-mute);font-size:12px">${d.accounts.length}</span>` : ''}</div>`).join('')}
        <div class="foot">
          自动刷新 4s<br>
          ${d.config.host}:${d.config.port}
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div><h1>${h1}</h1><div class="sub">${sub}</div></div>
          <div class="row">
            ${state.view === 'accounts' ? `<button class="btn" onclick="exportAccounts()">导出</button><button class="btn" onclick="openWebLogin()">网页登录</button><button class="btn primary" onclick="openImport()">导入账号</button>` : ''}
            ${state.view === 'accounts' && d.accounts.length ? `<button class="btn" onclick="clearCooldowns()">清空冷却</button>` : ''}
          </div>
        </div>
        <div id="view">${views[state.view](d)}</div>
      </main>
    </div>`;

  document.querySelectorAll('.nav').forEach((el) => {
    el.onclick = () => { state.view = el.dataset.view; render(); if (state.view === 'logs') loadLogs(); };
  });
  document.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => accountAction(b.dataset.act, b); });
  if (state.view === 'settings') wireSettings();
  if (state.view === 'accounts') state.timerLogs = true;
}

// ── 账号动作 ────────────────────────────────────────────
async function accountAction(act, btn) {
  const id = btn.dataset.id;
  const done = (msg, kind = 'ok') => { toast(msg, kind); refresh(); };
  try {
    if (act === 'probe') {
      btn.disabled = true; btn.textContent = '探测中…';
      const r = await api(`/accounts/${encodeURIComponent(id)}/probe`, { method: 'POST' });
      done(r.ok ? `探活成功 ${r.ms}ms` : `探活失败：${r.code}`, r.ok ? 'ok' : 'err');
    } else if (act === 'relogin' || act === 'browser') {
      // 走同源登录页，登录后脚本自动抓 token（不需要 playwright）
      openWebLogin();
    } else if (act === 'reset') {
      if (!confirm('重置设备指纹会清空该账号的 cookie，通常需要重新登录。继续？')) return;
      await api(`/accounts/${encodeURIComponent(id)}/reset-device`, { method: 'POST' });
      done('设备指纹已重置');
    } else if (act === 'toggle') {
      const enabled = btn.dataset.enabled === 'true';
      await api(`/accounts/${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify({ enabled: !enabled }) });
      done(enabled ? '已停用' : '已启用');
    } else if (act === 'rename') {
      const name = prompt('账号备注名：', btn.dataset.name || '');
      if (name === null) return;
      await api(`/accounts/${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify({ name }) });
      done('已更新');
    } else if (act === 'del') {
      if (!confirm('确定删除该账号？')) return;
      await api(`/accounts/${encodeURIComponent(id)}`, { method: 'DELETE' });
      done('已删除');
    }
  } catch (e) {
    if (e.message !== 'unauthorized') toast(String(e.message), 'err');
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function clearCooldowns() {
  const r = await api('/cooldowns/clear', { method: 'POST' });
  toast(`已清空 ${r.cleared} 个账号的冷却`);
  refresh();
}

async function exportAccounts() {
  if (!confirm('导出文件包含明文 token，确认？')) return;
  const res = await fetch('/admin/api/export?confirm=1', { headers: { 'X-Admin-Token': state.token } });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'accounts.export.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── 导入对话框 ──────────────────────────────────────────
function openImport() {
  const dlg = document.createElement('dialog');
  dlg.innerHTML = `
    <h3>导入账号</h3>
    <div class="d-sub">自有账号 · token 可在浏览器 localStorage 的 <code>userToken</code> 里找到</div>
    <div class="seg">
      <button class="on" data-tab="weblogin">网页登录</button>
      <button data-tab="token">粘贴 token</button>
      <button data-tab="batch">批量</button>
    </div>
    <div data-pane="weblogin">
      <div class="hint" style="margin-bottom:14px">
        打开 DeepSeek 登录页（已反代到本机），用你的账号登录。<br>
        登录成功后页面标题会变成「✓ 已捕获登录态」，token 和 deviceId 自动进账号池。
      </div>
      <button class="btn primary" onclick="openWebLogin()">打开登录页</button>
    </div>
    <div data-pane="token">
      <label class="field"><span>备注名</span><input type="text" id="imp-name" placeholder="例如：主号（可选）"></label>
      <label class="field"><span>userToken</span>
        <div style="display:flex;gap:8px">
          <input type="text" id="imp-token" placeholder="Bearer 后面的那串" style="flex:1">
          <button class="btn sm" id="imp-paste" type="button">从剪贴板</button>
        </div>
      </label>
      <label class="field"><span>deviceId（可空，自动生成 UUIDv4）</span><input type="text" id="imp-dev" placeholder="留空自动生成"></label>
    </div>
    <div data-pane="batch" hidden>
      <label class="field"><span>内容</span>
        <textarea id="imp-batch" placeholder='支持两种格式：
1) 每行一个 token
2) [{"name":"a1","token":"…","deviceId":"…"}]'></textarea>
      </label>
    </div>
    <div data-pane="browser" hidden>
      <div class="hint" style="margin-bottom:14px">
        会弹出真浏览器，你手动登录 + 过验证码，脚本自动回收 token / deviceId / cookie。
        <br>需要先在「设置」里启用慢路径。
      </div>
      <label class="field"><span>备注名</span><input type="text" id="imp-name2" placeholder="例如：主号（可选）"></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:18px">
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="confirm">导入</button>
    </div>`;
  document.body.appendChild(dlg);
  dlg.showModal();

  let tab = 'weblogin';
  dlg.querySelectorAll('.seg button').forEach((b) => {
    b.onclick = () => {
      tab = b.dataset.tab;
      dlg.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      dlg.querySelectorAll('[data-pane]').forEach((p) => { p.hidden = p.dataset.pane !== tab; });
    };
  });
  const pasteBtn = $('#imp-paste', dlg);
  if (pasteBtn) pasteBtn.onclick = async () => {
    try {
      const txt = await navigator.clipboard.readText();
      if (!txt) return toast('剪贴板是空的', 'err');
      $('#imp-token', dlg).value = txt.trim();
      toast('已从剪贴板填入', 'ok');
    } catch (e) {
      toast('读不到剪贴板，请长按输入框手动粘贴', 'err');
    }
  };
  $('#cancel', dlg).onclick = () => dlg.close();
  dlg.onclose = () => dlg.remove();

  $('#confirm', dlg).onclick = async () => {
    try {
      if (tab === 'weblogin') { dlg.close(); openWebLogin(); return; }
      if (tab === 'token') {
        const token = $('#imp-token', dlg).value.trim();
        if (!token) return toast('token 不能为空', 'err');
        const r = await api('/accounts/import', {
          method: 'POST',
          body: JSON.stringify({ token, name: $('#imp-name', dlg).value.trim(), deviceId: $('#imp-dev', dlg).value.trim() || undefined }),
        });
        toast(`已导入 ${r.created.length} 个账号`, 'ok');
      } else if (tab === 'batch') {
        const raw = $('#imp-batch', dlg).value.trim();
        if (!raw) return toast('内容为空', 'err');
        let items;
        try {
          const parsed = JSON.parse(raw);
          items = Array.isArray(parsed) ? parsed : parsed.accounts ? parsed.accounts : [parsed];
        } catch {
          items = raw.split('\n').map((l) => l.trim()).filter(Boolean).map((token) => ({ token }));
        }
        const r = await api('/accounts/import', { method: 'POST', body: JSON.stringify({ accounts: items }) });
        toast(`已导入 ${r.created.length} 个账号`, 'ok');
      } else {
        const r = await api('/accounts/import', {
          method: 'POST',
          body: JSON.stringify({ token: 'PENDING_' + Math.random().toString(36).slice(2), name: $('#imp-name2', dlg).value.trim() }),
        });
        const id = r.created[0].id;
        toast('已建占位账号，正在打开浏览器…');
        const lr = await api(`/accounts/${encodeURIComponent(id)}/browser-login`, { method: 'POST' });
        toast(lr.ok ? '登录成功，已回收凭证' : `失败：${lr.error}`, lr.ok ? 'ok' : 'err');
      }
      dlg.close();
      refresh();
    } catch (e) {
      if (e.message !== 'unauthorized') toast(String(e.message), 'err');
    }
  };
}

function wireSettings() {
  const collectModels = () => [...document.querySelectorAll('#model-table tbody tr[data-row]')].map((tr) => ({
    id: $('.m-id', tr).value.trim(),
    upstream: $('.m-up', tr).value,
    thinking: $('.m-think', tr).checked,
    enabled: $('.m-on', tr).checked,
    label: $('.m-label', tr).value.trim(),
  })).filter((m) => m.id);

  document.querySelectorAll('[data-del-model]').forEach((b) => {
    b.onclick = () => { b.closest('tr').remove(); };
  });

  $('#add-model').onclick = () => {
    const tb = $('#model-table tbody');
    if (tb.querySelector('.empty')) tb.innerHTML = '';
    const i = Date.now();
    tb.insertAdjacentHTML('beforeend', `
      <tr data-row="${i}">
        <td><input type="text" class="m-id" value="deepseek-custom" style="min-width:150px"></td>
        <td><select class="m-up" style="min-width:110px">${(state.data.upstreamTypes || ['default','expert','vision']).map((u) => `<option value="${u}">${u}</option>`).join('')}</select></td>
        <td style="text-align:center"><input type="checkbox" class="m-think"></td>
        <td style="text-align:center"><input type="checkbox" class="m-on" checked></td>
        <td><input type="text" class="m-label" value="" style="min-width:150px"></td>
        <td class="actions"><button class="btn sm danger" data-del-model="${i}">删除</button></td>
      </tr>`);
    const btn = document.querySelector(`[data-del-model="${i}"]`);
    if (btn) btn.onclick = () => btn.closest('tr').remove();
  };

  $('#save-models').onclick = async () => {
    const list = collectModels();
    if (!list.length) return toast('至少保留一个模型', 'err');
    await api('/settings', { method: 'POST', body: JSON.stringify({ models: list }) });
    toast('模型设置已保存', 'ok');
    refresh();
  };

  $('#save-settings').onclick = async () => {
    const keys = $('#s-keys').value.split(',').map((s) => s.trim()).filter(Boolean);
    const patch = {
      rateLimitPerMinute: Number($('#s-rate').value),
      powRefreshMarginMs: Number($('#s-margin').value),
      browser: { enabled: $('#s-browser').value === '1', cdpUrl: $('#s-cdp').value.trim() },
    };
    if (keys.length) patch.apiKeys = keys;
    await api('/settings', { method: 'POST', body: JSON.stringify(patch) });
    toast('已保存（config.json）', 'ok');
    refresh();
  };
  $('#test-browser').onclick = async () => {
    toast('正在连接浏览器…');
    const r = await api('/browser/test', { method: 'POST' });
    toast(r.ok ? '连接成功，已捕获登录态' : `失败：${r.error}`, r.ok ? 'ok' : 'err');
  };
}

async function loadLogs() {
  const r = await api('/logs?limit=120');
  state.logs = r.logs;
  const v = $('#view');
  if (v && state.view === 'logs') v.innerHTML = views.logs();
}

// ── 启动 ────────────────────────────────────────────────
(async function boot() {
  if (!state.token) return renderLogin();
  try {
    await refresh();
    state.timer = setInterval(async () => {
      try {
        await refresh();
        if (state.view === 'logs') await loadLogs();
      } catch { /* 忽略单次失败 */ }
    }, 4000);
  } catch { /* 登录页已渲染 */ }
})();
</script>
</body>
